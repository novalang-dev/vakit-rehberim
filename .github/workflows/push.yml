name: Namaz Vakti Bildirim Robotu

on:
  schedule:
    # GitHub UTC saatini kullanır. Türkiye saatiyle (UTC+3):
    # Öğle civarı (TR 12:00 - 13:30 arası için)
    - cron: '0 9,10 * * *' 
    # İkindi civarı (TR 15:00 - 16:30 arası için)
    - cron: '0 12,13 * * *'
    # Akşam civarı (TR 17:00 - 18:30 arası için)
    - cron: '0 14,15 * * *'
    # Yatsı civarı (TR 19:00 - 20:30 arası için)
    - cron: '0 16,17 * * *'
  workflow_dispatch: 

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v3

      - name: Node.js Kur
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Bağımlılıkları Yükle
        run: npm install web-push

      - name: Bildirim Gönder
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          SUBSCRIPTION_JSON: ${{ secrets.SUBSCRIPTION_JSON }}
        run: node send-push.js