name: Namaz Vakti Bildirim Robotu

on:
  schedule:
    - cron: '*/3 * * * *' 
  workflow_dispatch: 

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v3

      - name: Node.js Kur
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Bağımlılıkları Yükle
        run: npm install web-push

      # HAFIZA ADIMI: Son bildirim dosyasını geri yükle
      - name: Hafızayı Geri Yükle
        uses: actions/cache@v3
        with:
          path: .son-bildirim.json
          key: bildirim-hafizasi-v1

      - name: Bildirim Gönder
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          SUBSCRIPTION_JSON: ${{ secrets.SUBSCRIPTION_JSON }}
        run: node send-push.js

      # Hafızayı kaydet (Bir sonraki çalışmada hatırlaması için)
      - name: Hafızayı Kaydet
        uses: actions/cache@v3
        with:
          path: .son-bildirim.json
          key: bildirim-hafizasi-v1