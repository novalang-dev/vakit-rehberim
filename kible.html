<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kıble Pusulası</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top-section" style="padding-top: 2rem;">
    <div class="header-nav">
      <button class="icon-btn" onclick="window.location.href='index.html'"><i class="fa-solid fa-arrow-left"></i></button>
      <span class="app-name">Kıble Pusulası</span>
      <div style="width: 40px;"></div>
    </div>
  </header>
  <main class="main-content" style="text-align: center;">
    <div style="font-size: 5rem; color: var(--primary-gold); margin: 2rem 0;">
      <i class="fa-solid fa-compass"></i>
    </div>
    <h2 style="margin-bottom: 1rem;">Kıble Yönü</h2>
    <div id="kiblePusula" style="font-size: 1.5rem; color: var(--primary-gold);">Yön: --</div>
    <p style="margin-top: 2rem; font-size: 0.9rem; color: #94a3b8;">Cihazınızı düz tutarak kıble yönünü bulabilirsiniz. (Telefon sensörü gerektirir)</p>
  </main>
  <nav id="tabs" class="bottom-nav">
    <button onclick="window.location.href='index.html'"><i class="fa-solid fa-clock"></i><span>Vakitler</span></button>
    <button class="active" onclick="window.location.href='kible.html'"><i class="fa-solid fa-compass"></i><span>Kıble</span></button>
    <button onclick="window.location.href='zikir.html'"><i class="fa-solid fa-circle-dot"></i><span>Zikir</span></button>
    <button onclick="window.location.href='ramazan.html'"><i class="fa-solid fa-moon"></i><span>Ramazan</span></button>
  </nav>
  <script>
    // Kıble pusulası sensör kodu
    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientationabsolute', function(e) {
        let heading = e.alpha ? 360 - e.alpha : null;
        if (heading !== null) {
          document.getElementById('kiblePusula').innerText = `Kıble Yönü: ${Math.round(heading)}° (Kabe yaklaşık 150° yönünde)`;
        }
      });
    } else {
      document.getElementById('kiblePusula').innerText = "Bu cihaz pusula sensörünü desteklemiyor.";
    }
  </script>
</body>
</html>
